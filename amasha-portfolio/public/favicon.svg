<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="akBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="45%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="akShine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0" />
    </linearGradient>
    <filter id="akGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0ea5e9" flood-opacity="0.6"/>
    </filter>
  </defs>
  <!-- Background Squircle with Glow -->
  <rect x="3" y="3" width="58" height="58" rx="16" fill="url(#akBg)" filter="url(#akGlow)"/>
  <!-- Specular Outer Border -->
  <rect x="3" y="3" width="58" height="58" rx="16" stroke="rgba(255,255,255,0.4)" stroke-width="1.5" fill="none"/>
  <!-- Top Glass Highlight -->
  <rect x="4" y="4" width="56" height="28" rx="14" fill="url(#akShine)" opacity="0.65"/>
  <!-- Monogram AK -->
  <text x="50%" y="54%" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif" font-weight="900" font-size="28" fill="#ffffff" letter-spacing="-1.5">AK</text>
</svg>